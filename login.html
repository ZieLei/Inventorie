<!DOCTYPE html>

<html lang="en">

<head>

  <title>Inventorie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

</head>

<body>
  <div class="auth-container">

    <div class="auth-card">

      <form class="auth-form" action="login.html" method="POST">

        <div class="form-header">

          <h2 class="create-account-text">Login to an account</h2>
          <p class="login-prompt">
            Don't have an account? <a>Signup</a>
          </p>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="8"
            autocomplete="new-password">
        </div>

        <button type="submit" class="submit-button">Login</button>

        <div class="social-login">
          <button class="google-btn"> <img src="icons/search.png" alt="logo"> Google</button>
          <button class="apple-btn"> <img src="icons/apple-logo.png" alt="logo"> Apple</button>
        </div>

      </form>

      <div class="auth-banner login-banner">

      </div>
    </div>

  </div>

</body>

</html>
